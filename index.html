<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangla → Poetic Urdu</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a2118;--muted:#7d6f5e;--line:#e3d8c3;--accent:#8a3b2a;--accent-ink:#fffaf2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#201a14;--ink:#efe6d6;--muted:#a09280;--line:#3a3025;--accent:#d9876f;--accent-ink:#1c140e}}
:root[data-theme="dark"]{--bg:#17130f;--card:#201a14;--ink:#efe6d6;--muted:#a09280;--line:#3a3025;--accent:#d9876f;--accent-ink:#1c140e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:36px 20px 60px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.2rem;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 26px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label.t{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:140px;resize:vertical;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;line-height:1.7}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);padding:9px 16px;font:inherit;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.go{margin-left:auto;border:0;background:var(--accent);color:var(--accent-ink);padding:11px 24px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
#out{min-height:90px;white-space:pre-wrap;line-height:2;font-size:1.25rem}
#out.ur{direction:rtl;text-align:right;font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",serif;line-height:2.4;font-size:1.3rem}
#out.ro{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;font-style:italic;line-height:1.7}
.ph{color:var(--muted);font-style:normal;font-family:Inter,sans-serif;font-size:.95rem;direction:ltr;text-align:left;display:block}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cp{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 12px;font:inherit;font-size:.8rem;cursor:pointer}
.err{color:#b3392b;font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Bangla → Urdu</h1>
  <p class="sub">Bangla script or Romanized Bangla in. Poetic Urdu out, line for line.</p>

  <div class="card">
    <label class="t" for="in">Your Bangla</label>
    <textarea id="in" placeholder="আমি তোমাকে ভালোবাসি&#10;ami tomake bhalobashi"></textarea>
  </div>

  <div class="row">
    <div class="seg" id="seg">
      <button data-m="ur" class="on">اردو</button>
      <button data-m="ro">Roman Urdu</button>
    </div>
    <button class="go" id="go">Make it poetic</button>
  </div>

  <div class="card">
    <div class="bar"><label class="t" style="margin:0">Urdu</label><button class="cp" id="cp" hidden>Copy</button></div>
    <div id="out" class="ur"><span class="ph">Your poetic Urdu will appear here.</span></div>
    <div class="err" id="err"></div>
  </div>
</main>

<script>
(function(){
  var mode='ur', $=function(i){return document.getElementById(i)};
  var inp=$('in'), out=$('out'), go=$('go'), err=$('err'), cp=$('cp');

  $('seg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    mode=b.dataset.m;
    [].forEach.call($('seg').children,function(x){x.classList.toggle('on',x===b)});
    out.className=mode==='ur'?'ur':'ro';
  });

  function prompt(lines){
    var script=mode==='ur'
      ? 'Urdu script (Urdu alphabet, e.g. محبت)'
      : 'Roman Urdu (Urdu written in Latin letters, natural and readable, e.g. mohabbat)';
    return 'You translate Bengali into poetic Urdu.\n'+
    'Input may be Bengali script or Bengali written in English letters.\n'+
    'Rules:\n'+
    '- Output language/script: '+script+'.\n'+
    '- Keep the exact meaning, but render it in a refined, poetic Urdu register with quiet depth (shayari-like word choice, gentle imagery where it fits).\n'+
    '- Do NOT exaggerate, embellish, add new ideas, or lengthen. No melodrama.\n'+
    '- Each input line must become exactly ONE output line. One line in = one line out. Never split or merge lines.\n'+
    '- Reply with ONLY a JSON array of strings, same length and order as the input array. No markdown, no commentary.\n\n'+
    'Input array:\n'+JSON.stringify(lines);
  }

  function parse(text,n){
    var t=text.replace(/```json|```/g,'').trim();
    var s=t.indexOf('['), e=t.lastIndexOf(']');
    if(s>-1&&e>s){
      try{var a=JSON.parse(t.slice(s,e+1)); if(Array.isArray(a)&&a.length===n) return a.map(String);}catch(_){}
    }
    return null;
  }

  go.addEventListener('click',async function(){
    err.textContent='';
    var raw=inp.value.replace(/\r/g,'');
    if(!raw.trim()){err.textContent='Write something first.';return;}
    var all=raw.split('\n'), idx=[], lines=[];
    all.forEach(function(l,i){ if(l.trim()){idx.push(i);lines.push(l.trim());} });

    go.disabled=true; go.textContent='Composing…'; cp.hidden=true;
    try{
      var sample=await claude.use('sample');
      if(!sample){err.textContent='This page needs Claude access to translate. Open it inside claude.ai.';return;}
      var res=await sample(prompt(lines),{modelTier:'default',cache:false});
      var arr=parse(res.text,lines.length);
      if(!arr){
        var res2=await sample(prompt(lines)+'\n\nIMPORTANT: the array must contain exactly '+lines.length+' strings.',{modelTier:'default',cache:false});
        arr=parse(res2.text,lines.length);
      }
      if(!arr){err.textContent='Could not keep the lines aligned. Please try again.';return;}
      var result=all.slice(); idx.forEach(function(p,k){result[p]=arr[k];});
      out.textContent=result.join('\n');
      cp.hidden=false;
    }catch(e){
      err.textContent=(e&&e.code==='rate_limited')?'Too many requests. Wait a moment.':
        (e&&e.code==='not_granted')?'Permission was declined.':'Something went wrong. Try again.';
    }finally{
      go.disabled=false; go.textContent='Make it poetic';
    }
  });

  cp.addEventListener('click',function(){
    try{navigator.clipboard.writeText(out.textContent);cp.textContent='Copied';setTimeout(function(){cp.textContent='Copy'},1200);}catch(_){}
  });
})();
</script>
</body>
</html>
